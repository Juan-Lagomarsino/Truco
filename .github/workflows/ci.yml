name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Restaurar, compilar y testear
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore TrucoUruguayo.slnx

      - name: Compilar
        run: dotnet build TrucoUruguayo.slnx --configuration Release --no-restore

      - name: Testear
        run: dotnet test TrucoUruguayo.slnx --configuration Release --no-build --verbosity normal
